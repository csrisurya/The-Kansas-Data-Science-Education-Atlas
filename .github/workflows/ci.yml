name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kansas_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://atlas_user:password@localhost:5432/kansas_atlas
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      API_V1_STR: /api/v1
      PROJECT_NAME: Kansas DS Education Atlas
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          source venv/bin/activate
          pytest --cov=app --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run tests
        run: |
          cd frontend
          npm test
      - name: Build frontend
        run: |
          cd frontend
          npm run build
